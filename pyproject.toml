[project]
name = "cosmology-revalidation"
version = "0.1.0"
description = "Reproducible calibration, population and cosmological inference"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "pandas==2.2.3",
  "matplotlib==3.10.3",
  "astropy==7.1.0",
  "emcee==3.1.6",
  "sncosmo==2.12.1",
  "extinction==0.4.9",
  "iminuit==2.31.1",
]

[project.optional-dependencies]
predictors = ["jax==0.6.2", "jaxlib==0.6.2", "numpyro==0.19.0"]

[tool.uv]
package = false
